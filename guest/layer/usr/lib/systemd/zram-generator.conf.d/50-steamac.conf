# steamac: zram swap as large as the guest's RAM, compressed with zstd (Fedora's default since F33) instead of
# SteamOS's ram/2 with lzo-rle (/usr/lib/systemd/zram-generator.conf, sized for a 16 GiB Deck). In an 8 GiB guest
# a heavy VRChat world (6.7 GiB, plus 1.9 GiB of idle Wine helper processes) filled RAM and the 4 GiB of zram and
# the guest kernel OOM-killed the game. Pages only cost RAM once swapped out, compressed; zstd stores more per
# page of RAM than lzo-rle, and idle processes' pages compress well. /usr/lib/steamac/swap-fallback adds a disk
# swap file behind it.
[zram0]
zram-size = ram
compression-algorithm = zstd
