# steamac: keep the OS's Steam service and its health/bootstrap hooks.
# steamvr.service is masked at runtime; its stock Wants/After are harmless.
[Unit]
After=gamescope-session.service

[Service]
UnsetEnvironment=STEAM_LAUNCH_WRAPPER_AFFINITY_LIST STEAM_DESKTOP_APP_AFFINITY_LIST
TimeoutStopSec=10
# These run after the stock ExecStartPre commands (including its cp -u).
ExecStartPre=/usr/lib/steamac/steam-client
ExecStartPre=-/usr/lib/steamac/steam-gfx-env
# Settings > Advanced "Graphics path": Proton's DXVK set or DXMT (steamac.gfx=), before Steam starts
ExecStartPre=-/usr/lib/steamac/steam-gfx-path
# Settings > Advanced "VR (experimental)": patched vrclient_x64 + our OpenVR runtime for Proton (steamac.vr=1)
ExecStartPre=-/usr/lib/steamac/steam-vr-path
# Settings > VR "Tracker app": a tracker product's SteamVR driver + app with VR games (steamac.vr_companion=APPID)
ExecStartPre=-/usr/lib/steamac/steam-vr-companion
# Settings > Advanced "Frame latency": dxgi.maxFrameLatency in the guest's DXVK config (steamac.frame_latency=)
ExecStartPre=-/usr/lib/steamac/steam-frame-latency
ExecStartPre=-/usr/lib/steamac/steam-shader-defaults
ExecStartPre=-/usr/lib/steamac/mac-clock-format
ExecStartPost=/usr/lib/steamac/steam-client --watch $MAINPID
ExecStartPost=-/usr/lib/steamac/steam-vr-companion --watch $MAINPID
