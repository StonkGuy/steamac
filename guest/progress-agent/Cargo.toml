[package]
name = "fx-progress-agent"
version = "1.0.0"
edition = "2021"
description = "steamac guest agent: reports SteamOS session / Steam client start progress and shutdown to the FX Steam Launcher overlay over the virtio-console port fx.progress"
license = "Apache-2.0"
publish = false

[dependencies]
# Pure-Rust X11 client (RustConnection); no libxcb / C libraries. XFixes: clipboard
# owner changes (clipx11.rs).
x11rb = { version = "0.13", default-features = false, features = ["xfixes"] }
# Raw syscalls only: open/write/fcntl, sigaction/pause, mktime.
libc = "0.2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
